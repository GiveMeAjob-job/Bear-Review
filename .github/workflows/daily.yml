name: Daily Review

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      report_type:
        description: "报告类型"
        type: choice
        default: "yesterday"
        options:
          - "yesterday"
          - "today"
          - "three-days"
      dry_run:
        description: "试运行（不发送通知）"
        type: boolean
        default: false
      verbose:
        description: "详细日志"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scheduled-yesterday:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/report-runner.yml
    with:
      report_name: Daily Review
      period: daily
      yesterday: true
      notification_mode: smart
      artifact_name: daily-review
    secrets: inherit

  manual-yesterday:
    if: github.event_name == 'workflow_dispatch' && inputs.report_type == 'yesterday'
    uses: ./.github/workflows/report-runner.yml
    with:
      report_name: Daily Review
      period: daily
      yesterday: true
      dry_run: ${{ inputs.dry_run }}
      verbose: ${{ inputs.verbose }}
      notification_mode: smart
      artifact_name: daily-review-manual-yesterday
    secrets: inherit

  manual-today:
    if: github.event_name == 'workflow_dispatch' && inputs.report_type == 'today'
    uses: ./.github/workflows/report-runner.yml
    with:
      report_name: Daily Review (Today)
      period: daily
      dry_run: ${{ inputs.dry_run }}
      verbose: ${{ inputs.verbose }}
      notification_mode: smart
      artifact_name: daily-review-manual-today
    secrets: inherit

  manual-three-day-trend:
    if: github.event_name == 'workflow_dispatch' && inputs.report_type == 'three-days'
    uses: ./.github/workflows/report-runner.yml
    with:
      report_name: Three-Day Trend
      period: three-days
      dry_run: ${{ inputs.dry_run }}
      verbose: ${{ inputs.verbose }}
      notification_mode: full
      artifact_name: three-day-trend
    secrets: inherit
