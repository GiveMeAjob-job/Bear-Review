name: Weekly Review

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "试运行（不发送通知）"
        type: boolean
        default: false
      verbose:
        description: "详细日志"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scheduled-weekly:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/report-runner.yml
    with:
      report_name: Weekly Review
      period: weekly
      notification_mode: full
      artifact_name: weekly-review
    secrets: inherit

  manual-weekly:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/report-runner.yml
    with:
      report_name: Weekly Review
      period: weekly
      dry_run: ${{ inputs.dry_run }}
      verbose: ${{ inputs.verbose }}
      notification_mode: full
      artifact_name: weekly-review-manual
    secrets: inherit
