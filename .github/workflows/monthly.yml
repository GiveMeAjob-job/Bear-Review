name: Monthly Review

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "试运行（不发送通知）"
        type: boolean
        default: false
      verbose:
        description: "详细日志"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scheduled-monthly:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/report-runner.yml
    with:
      report_name: Monthly Review
      period: monthly
      notification_mode: full
      artifact_name: monthly-review
    secrets: inherit

  manual-monthly:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/report-runner.yml
    with:
      report_name: Monthly Review
      period: monthly
      dry_run: ${{ inputs.dry_run }}
      verbose: ${{ inputs.verbose }}
      notification_mode: full
      artifact_name: monthly-review-manual
    secrets: inherit
